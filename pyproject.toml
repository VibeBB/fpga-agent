[project]
name = "fpga-agent"
version = "0.1.0"
description = "OpenHands plugin for FPGA development (HDL/RTL, simulation, formal, synthesis, place-and-route, bitstream) gated by deterministic open-source toolchain checks"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]
sdk-check = ["openhands-sdk==1.52.0", "openhands-tools==1.52.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpga"]

[tool.uv]
required-version = "==0.12.23"
default-groups = ["dev", "sdk-check"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests", "plugins/fpga/hooks/scripts", "plugins/fpga/scripts"]
exclude = ["**/__pycache__", ".venv", "examples"]

[tool.coverage.run]
source = ["src/fpga"]
branch = false

[tool.coverage.report]
fail_under = 67

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = ["."]
markers = ["tools: needs the OSS CAD Suite and NVC on PATH"]
