[project]
name = "fpga-agent"
version = "0.1.0"
description = "OpenHands plugin for FPGA development (HDL/RTL, simulation, formal, synthesis, place-and-route, bitstream) gated by deterministic open-source toolchain checks"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]
sdk-check = ["openhands-sdk==1.53.0", "openhands-tools==1.53.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpga"]

[tool.uv]
required-version = "==0.12.23"
default-groups = ["dev", "sdk-check"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = [
  "scripts/mutation_probe.py",
  "scripts/structural_coverage.py",
  "tests/test_mutation_probe.py",
  "tests/test_structural_coverage.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests", "plugins/fpga/hooks/scripts", "plugins/fpga/scripts"]
exclude = ["**/__pycache__", ".venv", "examples"]

[tool.coverage.run]
source = ["src/fpga"]
branch = true

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance. Raise them, never lower.
# Measured as CI's verify job runs: no FPGA toolchain on PATH (the `tools`
# tests run in the e2e image, which is not coverage-gated).
c0 = 82
c1 = 67
decision = 59
c2 = 56
mcdc = 34
boundary = 24

[tool.vibebb-mutation]
# Advisory weekly mutation probe (scripts/mutation_probe.py); never a gate.
targets = ["src/fpga/gates.py"]
tests = ["tests/test_gates.py", "tests/test_gate_boundaries.py"]
max_mutants = 400

[tool.coverage.report]
fail_under = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = ["."]
markers = ["tools: needs the OSS CAD Suite and NVC on PATH"]
