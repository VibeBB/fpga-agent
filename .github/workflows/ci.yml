name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --locked
      - name: Fetch Colibri
        run: python3 scripts/fetch_colibri.py
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
      - name: Plugin load (OpenHands SDK)
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: uv run --group sdk-check python scripts/check_plugin_load.py
      - name: Docs
        run: uv run python scripts/verify_docs.py

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build fpga-tools image
        run: >-
          docker buildx build --load
          -f docker/fpga-tools.Dockerfile -t fpga-tools:ci
          --build-arg IMAGE_REVISION=${{ github.sha }}
          --cache-from type=gha,scope=fpga-tools
          --cache-to type=gha,mode=max,scope=fpga-tools .
      - name: Fetch Colibri
        run: python3 scripts/fetch_colibri.py
      - name: Full gates in the image (no network)
        env:
          FPGA_TOOLS_IMAGE: fpga-tools:ci
          FPGA_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/fpga/scripts/fpga_launcher.py
          python3 "$launcher" doctor > doctor.json
          for contract in examples/*/*.fpga.json; do
            python3 "$launcher" gates "$contract" > report.json || true
            python3 - "$contract" report.json <<'PY'
          import json, sys
          report = json.load(open(sys.argv[2], encoding="utf-8"))
          print(sys.argv[1], report["verdict"])
          for check in report["checks"]:
              print(f"  {check['id']:28} {check['status']:14} {check['detail'][:200]}")
          sys.exit(0 if report["verdict"] == "pass" else 1)
          PY
          done
      - name: Tool-backed tests in the image
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)" -e HOME=/tmp -e UV_PROJECT_ENVIRONMENT=/tmp/venv
          -v "$PWD:$PWD" -w "$PWD" fpga-tools:ci
          sh -c 'uv sync --locked --no-group sdk-check && uv run --no-sync pytest -m tools'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpga-reports
          path: examples/*/fpga-reports/
          if-no-files-found: warn
