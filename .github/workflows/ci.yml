name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
      pinscript: ${{ steps.scope.outputs.pinscript }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      # Only pull_request events diff BASE_SHA..HEAD_SHA; push/dispatch/call
      # events short-circuit to code=true below and never need the clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 100
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fetch-depth: 100 covers ordinary PRs; fetch the base commit and
          # deepen progressively when the merge base is still unreachable
          # (long-lived PRs or deep main history), unshallowing as a last
          # resort so the diff can never silently cover an empty range.
          git cat-file -e "$BASE_SHA" 2>/dev/null || \
            git fetch -q --depth=100 origin "$BASE_SHA"
          attempt=0
          until git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "$attempt" -lt 4 ]; then
              git fetch -q --deepen=500 origin || break
            else
              git fetch -q --unshallow origin || break
            fi
          done
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          pinscript=false
          if grep -qE '^(scripts/publish_image_pin_pr\.sh|tests/test_publish_image_pin_pr\.py|\.github/workflows/publish-fpga-images\.yml)$' "$RUNNER_TEMP/changed-files"; then
            pinscript=true
          fi
          echo "pinscript=$pinscript" >> "$GITHUB_OUTPUT"

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/fpga-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/fpga-tools.Dockerfile .

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Forward-compatibility canary ahead of the 2026-10-09 stable
          # release: step-level continue-on-error keeps the leg green while
          # the last step reports the failure as an annotation.
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: ${{ matrix.experimental || false }}
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv sync --locked
      - name: Fetch Colibri
        id: fetch-colibri
        continue-on-error: ${{ matrix.experimental || false }}
        run: python3 scripts/fetch_colibri.py
      - name: Ruff
        id: ruff
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pyright
        id: pyright
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run pyright
      - name: Shared hooks
        id: shared-hooks
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        id: check-shared-workflows
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/check_shared_workflows.py
      - name: Pytest
        id: pytest
        continue-on-error: ${{ matrix.experimental || false }}
        # Floor is below the ~76.5% this job measures (tools-marked tests
        # only run in e2e, which has the OSS CAD Suite) but above the
        # [tool.coverage.report] fail_under=67 baseline so the existing
        # coverage measurement now gates regressions.
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Plugin load (OpenHands SDK)
        id: plugin-load-openhands-sdk
        continue-on-error: ${{ matrix.experimental || false }}
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: uv run --group sdk-check python scripts/check_plugin_load.py
      - name: Docs
        id: docs
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/verify_docs.py

      - name: Report 3.15 canary outcome
        if: matrix.experimental && (steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.fetch-colibri.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.pyright.outcome == 'failure' || steps.shared-hooks.outcome == 'failure' || steps.check-shared-workflows.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.plugin-load-openhands-sdk.outcome == 'failure' || steps.docs.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  # prodeng-style guard: the pin-PR script drives branch protection and
  # auto-merge during real publishes, so its stub tests run on PRs that
  # touch the script, its tests, or the publishing workflow.
  pin-script-guard:
    needs: changes
    if: needs.changes.outputs.pinscript == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: pin-script-guard
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run pin-PR script tests
        run: uv run pytest tests/test_publish_image_pin_pr.py -q

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # The GHCR buildcache survives the gha cache's eviction window and is
      # readable by pull_request runs, where most cold builds happened. The
      # cache lives as a `buildcache` tag on the public fpga-tools package so
      # anonymous pulls (local `docker buildx --cache-from`) reuse it too; a
      # separate -buildcache package would default to private. The login is
      # skipped for fork PRs (their token cannot read packages), so those runs
      # keep the original gha-only behavior.
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fpga-tools image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fpga-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ inputs.ref || github.sha }}
          load: true
          tags: fpga-tools:ci
          # Same default gha scope publish-fpga-images.yml uses: e2e
          # imports the cache publish keeps warm on main. The previous
          # raw `docker buildx build` never received the ACTIONS_* cache
          # envs, so its --cache-* flags were dead config. The registry
          # buildcache is added as the primary store once the GHCR login
          # succeeds; gha stays the read/write fallback.
          cache-from: |
            type=gha
            ${{ steps.ghcr-login.outcome == 'success' && format('type=registry,ref=ghcr.io/{0}/fpga-tools:buildcache', env.IMAGE_OWNER) || '' }}
          cache-to: >-
            ${{ steps.ghcr-login.outcome == 'success' && github.event_name != 'pull_request'
                && format('type=registry,ref=ghcr.io/{0}/fpga-tools:buildcache,mode=max', env.IMAGE_OWNER)
                || 'type=gha,mode=max,ignore-error=true' }}
      - name: Fetch Colibri
        run: python3 scripts/fetch_colibri.py
      - name: Full gates in the image (no network)
        env:
          FPGA_TOOLS_IMAGE: fpga-tools:ci
          FPGA_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/fpga/scripts/fpga_launcher.py
          python3 "$launcher" doctor > doctor.json
          for contract in examples/*/*.fpga.json; do
            python3 "$launcher" gates "$contract" > report.json || true
            python3 - "$contract" report.json <<'PY'
          import json, sys
          report = json.load(open(sys.argv[2], encoding="utf-8"))
          print(sys.argv[1], report["verdict"])
          for check in report["checks"]:
              print(f"  {check['id']:28} {check['status']:14} {check['detail'][:200]}")
          sys.exit(0 if report["verdict"] == "pass" else 1)
          PY
          done
      - name: Tool-backed tests in the image
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)" -e HOME=/tmp -e UV_PROJECT_ENVIRONMENT=/tmp/venv
          -v "$PWD:$PWD" -w "$PWD" fpga-tools:ci
          sh -c 'uv sync --locked --no-group sdk-check && uv run --no-sync pytest -m tools'
      - name: Upload reports
        if: always() && hashFiles('examples/*/fpga-reports/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpga-reports
          path: examples/*/fpga-reports/
          if-no-files-found: warn
