name: Publish fpga images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/fpga/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/measure_image_tools.py"
      - "scripts/fetch_colibri.py"
      - "scripts/print_locked_image.py"
      - "scripts/pull_locked_image.py"
      - "scripts/update_image_digest_lock.py"
      - ".github/workflows/publish-fpga-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "!docker/image-digests.json"
      # The plugin pin is written by this workflow itself; exclude it so a
      # merged pin PR does not trigger another publish.
      - "!plugins/fpga/tools-image.json"
      - "!docker/README.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the publish: build and gate the image locally, but skip the registry push, :latest promotion, attestations, SARIF upload, the digest-lock PR, and post-merge dispatches"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-fpga-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      # Approves action_required pull_request runs on the lock branch.
      actions: write
      # Pushes the bot digest-lock branch.
      contents: write
      # Pushes the fpga-tools image to ghcr.io.
      packages: write
      # Opens and auto-merges the digest-lock pull request.
      pull-requests: write
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      artifact-metadata: write # creates the attestation storage record
      security-events: write # uploads the Trivy SARIF scan to code scanning
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: publish
      - name: Sync dependencies
        run: uv sync --locked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and publish tools
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fpga-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          # dry_run keeps the image in the local daemon for the gates
          # below; nothing reaches the registry.
          push: ${{ inputs.dry_run != true }}
          load: ${{ inputs.dry_run == true }}
          # Only the immutable per-sha tag is pushed at build time; the
          # mutable :latest tag is promoted after every gate below passes,
          # so a failed scan never serves a new :latest.
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/fpga-tools:${{ github.sha }}-tools
          cache-from: type=gha
          # A failed cache export must not fail the publish; gha cache
          # imports already degrade to a miss rather than an error, so
          # ignore-error applies to cache-to only.
          cache-to: type=gha,mode=max,ignore-error=true
      # The full JSON scan runs before the SARIF gate so the diagnostic
      # report exists even when the gate fails — exactly when it is needed.
      - name: Scan tools image (Trivy JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Scan the immutable sha tag — the same manifest the pushed
          # digest addresses on a real run, and the local image under
          # dry_run.
          scan-ref: ghcr.io/${{ env.IMAGE_OWNER }}/fpga-tools:${{ github.sha }}-tools
          version: v0.75.0
          scanners: vuln,secret,misconfig,license
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-image.json
      # One image scan feeds both consumers: the JSON report is uploaded
      # for diagnostics, and `trivy convert` derives the SARIF + gate from
      # it instead of rescanning the same digest a second time.
      - name: Gate tools image on fixable CRITICAL/HIGH findings
        id: trivy-scan
        run: |
          set -euo pipefail
          # `trivy convert` has no --ignore-unfixed flag, so the SARIF
          # carries every CRITICAL/HIGH finding and the fixable-only gate
          # runs on the JSON: a CRITICAL/HIGH vuln with a non-empty
          # FixedVersion fails the publish.
          trivy convert --format sarif --severity CRITICAL,HIGH \
            --output trivy-image.sarif trivy-image.json
          jq -e '[.Results[]?.Vulnerabilities[]? |
            select(.Severity == "CRITICAL" or .Severity == "HIGH") |
            select((.FixedVersion // "") != "")] | length == 0' \
            trivy-image.json
      - name: Upload Trivy SARIF
        # A rehearsal must not file code-scanning alerts.
        if: always() && inputs.dry_run != true && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-fpga-tools
      - name: Upload Trivy JSON report
        if: always() && hashFiles('trivy-image.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpga-tools-trivy
          path: trivy-image.json
          retention-days: 90
      - name: Summarize Trivy gate failure
        # When the gate found fixable CRITICAL/HIGH findings, list the
        # offending rules in the step summary so the publish failure is
        # reviewable without downloading artifacts.
        if: always() && steps.trivy-scan.outcome == 'failure' && hashFiles('trivy-image.json') != ''
        run: |
          set -euo pipefail
          python3 scripts/trivy_gate_summary.py trivy-image.json >> "$GITHUB_STEP_SUMMARY"
      - name: Attest tools image provenance
        if: inputs.dry_run != true
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/fpga-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true
      - name: Resolve tools digest
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            # Nothing was pushed: retag the daemon-local image under a
            # slash-free name the measurement probe accepts, and reference
            # it everywhere below.
            docker tag \
              "ghcr.io/${IMAGE_OWNER}/fpga-tools:${GITHUB_SHA}-tools" \
              "fpga-tools:${GITHUB_SHA}-rehearsal"
            {
              printf 'TOOLS_REF=fpga-tools:%s-rehearsal\n' "$GITHUB_SHA"
              printf 'TOOLS_DIGEST=%s\n' "${BUILT_DIGEST:-unpublished}"
              printf 'TOOLS_TAG=%s-tools\n' "$GITHUB_SHA"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid tools digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
          TOOLS_REF="ghcr.io/${IMAGE_OWNER}/fpga-tools@${BUILT_DIGEST}"
          TOOLS_TAG="${GITHUB_SHA}-tools"
          printf 'TOOLS_REF=%s\nTOOLS_DIGEST=%s\nTOOLS_TAG=%s\n' "$TOOLS_REF" "${TOOLS_REF##*@}" "$TOOLS_TAG" >> "$GITHUB_ENV"
      - name: Generate tools SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # dry_run reads the just-built image from the local daemon.
          SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: ${{ inputs.dry_run == true && 'docker' || 'registry' }}
          TMPDIR: ${{ runner.temp }}
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.TOOLS_REF }}
          format: spdx-json
          output-file: ${{ runner.temp }}/fpga-tools.full.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Package tools SPDX SBOM
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/fpga-tools.full.spdx.json" \
            "$RUNNER_TEMP/fpga-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        env:
          SBOM_PATH: ${{ runner.temp }}/fpga-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        run: |
          python3 - "${{ runner.temp }}/fpga-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      - name: Attest tools SBOM
        if: inputs.dry_run != true
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/fpga-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          sbom-path: ${{ runner.temp }}/fpga-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpga-tools-spdx-sbom
          path: ${{ runner.temp }}/fpga-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure published tools
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: uv run --no-sync python scripts/measure_image_tools.py --image-ref "$TOOLS_REF" --out "$RUNNER_TEMP/fpga-tools.json"
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # dry_run already holds the image in the local daemon.
          if [ "$DRY_RUN" != "true" ]; then
            docker pull "$TOOLS_REF"
          fi
          export FPGA_TOOLS_IMAGE="$TOOLS_REF"
          export FPGA_SRC="$GITHUB_WORKSPACE/src"
          export OPENHANDS_PROJECT_DIR="$GITHUB_WORKSPACE"
          python3 scripts/fetch_colibri.py
          launcher=plugins/fpga/scripts/fpga_launcher.py
          python3 "$launcher" doctor | tee doctor.json
          for contract in examples/*/*.fpga.json; do
          python3 "$launcher" gates "$contract" > report.json || true
            python3 - "$contract" report.json <<'PY'
          import json, sys
          report = json.load(open(sys.argv[2], encoding="utf-8"))
          print(sys.argv[1], report["verdict"])
          for check in report["checks"]:
              print(f"  {check['id']:28} {check['status']:14} {check['detail'][:200]}")
          sys.exit(0 if report["verdict"] == "pass" else 1)
          PY
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('doctor.json', 'report.json', 'examples/*/out/*.fpga-report.json', 'examples/*/out/*.fpga-report.md', 'examples/*/out/*.log') != ''
        with:
          name: published-fpga-tools-smoke
          path: |
            doctor.json
            report.json
            examples/*/out/*.fpga-report.json
            examples/*/out/*.fpga-report.md
            examples/*/out/*.log
          if-no-files-found: ignore
      - name: Record published image summary
        run: |
          {
            echo "## fpga images"
            echo
            echo "- **tools**: \`$TOOLS_REF\`"
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **tools tag**: \`$TOOLS_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Promote :latest
        # Every gate above passed: point the mutable tag at the attested
        # digest. imagetools create copies the manifest server-side — no
        # re-push — so the provenance and SBOM attestations keep
        # referencing the same digest.
        if: inputs.dry_run != true
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${IMAGE_OWNER}/fpga-tools:latest" \
            "$TOOLS_REF"
      - name: Update digest lock and merge PR
        # dry_run stops at the summary: no lock PR, no post-merge dispatches.
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the published
          # source commit, so the PR stays mergeable when main moved during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          uv run --no-sync python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
            --entry fpga_tools --image "ghcr.io/${IMAGE_OWNER}/fpga-tools" \
            --tag "$TOOLS_TAG" --digest "$TOOLS_DIGEST" --published-at "$published_at" \
            --workflow-run "$workflow_run" --dockerfile docker/fpga-tools.Dockerfile \
            --attestation "$ATTESTATION_URL" \
            --sbom-attestation "$SBOM_ATTESTATION_URL" \
            --tools-json "$RUNNER_TEMP/fpga-tools.json"
          # Ship the same pin inside the plugin so an installed plugin can
          # resolve the tools image without the extension cache (the
          # launcher reads <plugin>/tools-image.json first).
          python3 - <<'PY'
          import json

          entry = json.load(open("docker/image-digests.json"))["fpga_tools"]
          pin = "plugins/fpga/tools-image.json"
          with open(pin, "w", encoding="utf-8") as out:
              json.dump(entry, out, indent=2)
              out.write("\n")
          PY
          # status --porcelain (not diff --quiet) so a still-untracked lock
          # file on the very first publish is detected as a change too.
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/fpga/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/fpga/tools-image.json
          git commit -m "Update FPGA image digest lock"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the FPGA image digest lock." \
            "" \
            "tools: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review.
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update FPGA image digest lock" --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "" "ci.yml locked-image-check.yml"
      - name: Note dry-run skips
        if: inputs.dry_run
        run: |
          {
            echo "### dry-run rehearsal"
            echo
            echo "Built and gated \`$TOOLS_REF\` without publishing. Skipped:"
            echo "- registry push of the image tag"
            echo "- SARIF upload to code scanning"
            echo "- provenance and SBOM attestations"
            echo "- :latest promotion"
            echo "- digest-lock pull request and post-merge dispatches"
          } >> "$GITHUB_STEP_SUMMARY"
