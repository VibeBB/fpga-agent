name: Container hardening audit

on:
  schedule:
    - cron: "32 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/container-audit.yml"
      - "docker/image-digests.json"
      - "docker/lynis-container.prf"
      # The audit logic was extracted to scripts/; edits self-verify on merge.
      - "scripts/container_hardening_report.py"
      - "scripts/container_hardening_markdown.py"
      - "scripts/upsert_report_issue.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned image from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scan to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and pull pinned image
        run: |
          set -euo pipefail
          # Same structural validation as locked-image-check.yml: a malformed
          # lock fails here instead of pulling an unexpected reference.
          ref=$(python3 - <<'PY'
          import json, re
          entry = json.load(open("docker/image-digests.json", encoding="utf-8"))["fpga_tools"]
          if entry.get("image") != "ghcr.io/vibebb/fpga-tools":
              raise SystemExit("image-digests.json fpga_tools has an unexpected image")
          digest = entry.get("digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("fpga_tools digest must be a sha256 digest")
          tag = entry.get("tag")
          if not isinstance(tag, str) or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None:
              raise SystemExit("fpga_tools tag must be a 40-character tools tag")
          print(entry["image"] + "@" + digest)
          PY
          )
          echo "PINNED_IMAGE=$ref" >> "$GITHUB_ENV"
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          retry docker pull "$ref"
      - name: Scan pinned image (Trivy SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # The digest is frozen; the vulnerability DB is not — this scan
          # surfaces newly disclosed CVEs against the shipped tools image.
          scan-ref: ${{ env.PINNED_IMAGE }}
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Scan pinned image (Trivy JSON, full)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.PINNED_IMAGE }}
          version: v0.75.0
          scanners: vuln,secret,misconfig,license
          exit-code: '0'
          format: json
          output: trivy-image.json
          skip-setup-trivy: true
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-fpga-tools-audit
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      # The trivy-action scans above keep their own daily DB cache; this
      # weekly key lets the plain-CLI CIS scan below reuse a ~120 MB DB
      # instead of re-downloading it every Monday.
      - id: trivy-db-week
        run: echo "key=trivy-db-$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.trivy-db-week.outputs.key }}
      - name: Run Docker CIS compliance report
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          # Returns 0 when the report carries at least one CIS check result
          # (a silently-empty report is a scanner anomaly, not coverage).
          cis_nonempty() {
            python3 - "$1" <<'PY'
          import json, sys
          def _summaries(node):
              yield node
              for child in node.get("Results") or []:
                  yield from _summaries(child)
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              data = {}
          total = 0
          for node in _summaries(data):
              summary = node.get("MisconfSummary") or {}
              total += int(summary.get("Successes", 0)) + int(summary.get("Failures", 0))
          sys.exit(0 if total else 1)
          PY
          }
          for attempt in 1 2; do
            trivy image --compliance docker-cis-1.6.0 --report all \
              --format json --output "$RUNNER_TEMP/trivy-cis.json" \
              "${PINNED_IMAGE}"
            cis_nonempty "$RUNNER_TEMP/trivy-cis.json" && break
            # Retry once on an empty result set before letting the
            # aggregation guard below fail the job — a transient
            # zero-result scan on a healthy digest was observed on
            # 2026-10-03. Purge the cached trivy data (vuln DB + checks
            # bundle) first so a poisoned weekly cache cannot produce
            # the same empty report on the retry; the config scan below
            # then re-downloads a fresh bundle too (run 37168758428).
            echo "::warning::Docker CIS scan produced no results (attempt $attempt)"
            rm -rf "$TRIVY_CACHE_DIR"
            sleep 30
          done
      - name: Scan Dockerfile config (Trivy misconfig)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          # `trivy image --scanners misconfig` emits no Misconfigurations
          # for this image class — the Dockerfile config scan is the real
          # misconfig coverage aggregated below.
          trivy config --format json --output trivy-config.json \
            docker/fpga-tools.Dockerfile
      - name: Run informational Lynis audit inside the image
        id: lynis
        continue-on-error: true
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
        run: |
          set -uo pipefail
          git clone --depth 1 --branch 3.1.7 \
            https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
          # 3.1.7 is a mutable tag; detach onto its reviewed commit so a
          # moved tag fails loudly instead of running different code.
          git -C "$RUNNER_TEMP/lynis" checkout --detach \
            2e99f92265760b73fd6b139868eb8d4116624030 || exit 1
          mkdir -p "$LYNIS_OUT"
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/lynis:/lynis:ro" \
            -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
            -v "$LYNIS_OUT:/out" \
            --entrypoint /bin/sh "$PINNED_IMAGE" \
            -c 'cd /lynis && ./lynis audit system --quick --no-colors \
                --profile /container.prf \
                --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                --auditor github-actions; \
                # Lynis writes its outputs with umask 027 (0640 root-owned):
                # loosen them so the runner-side grep below can read them.
                chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
          index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
            | head -1 | cut -d= -f2 || true)
          warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
          printf 'hardening_index=%s\nwarnings=%s\n' \
            "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          TRIVY_JSON: trivy-image.json
          TRIVY_CONFIG: trivy-config.json
          TRIVY_CIS: ${{ runner.temp }}/trivy-cis.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 scripts/container_hardening_report.py
      - name: Upload hardening report
        if: always() && hashFiles('container-hardening.json', 'trivy-image.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpga-tools-hardening-audit
          path: |
            container-hardening.json
            trivy-image.json
            trivy-config.json
          retention-days: 90
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
          LABEL: container-hardening
          LABEL_COLOR: d93f0b
          LABEL_DESCRIPTION: Container hardening report
          TITLE: Container hardening report
          CLOSE_COMMENT: No fixable HIGH/CRITICAL findings remain.
        # A clean run edits/closes an existing report issue but never
        # creates a fresh one — same shared rule as the dependency report.
        run: |
          set -euo pipefail
          python3 scripts/container_hardening_markdown.py > "$REPORT_MD"
          gate=$(python3 -c 'import json; print(json.load(open("container-hardening.json", encoding="utf-8"))["gate"]["fixable_high_or_critical"])')
          clean=0
          [ "$gate" = "0" ] && clean=1
          CLEAN=$clean bash scripts/upsert_report_issue.sh
