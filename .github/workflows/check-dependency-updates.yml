name: Dependency update check

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-dependency-updates
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Creates, edits, and closes the "Dependency update check report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          cache-suffix: dependency-updates
      - name: Sync dependencies
        run: uv sync --locked
      - name: Collect update candidates
        id: report
        env:
          REPORT_MD: ${{ runner.temp }}/report.md
          REPORT_JSON: ${{ runner.temp }}/report.json
        run: |
          uv run python scripts/check_dependency_updates.py \
            --markdown "$REPORT_MD" --json "$REPORT_JSON"
          printf '\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >> "$REPORT_MD"
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
          outdated=$(python3 -c \
            'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["outdated_count"])')
          unknown=$(python3 -c \
            'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["unknown_count"])')
          printf 'outdated=%s\nunknown_count=%s\n' "$outdated" "$unknown" >> "$GITHUB_OUTPUT"
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_MD: ${{ runner.temp }}/report.md
          OUTDATED: ${{ steps.report.outputs.outdated }}
          UNKNOWN_COUNT: ${{ steps.report.outputs.unknown_count }}
          LABEL: dependency-updates
          LABEL_COLOR: "0366d6"
          LABEL_DESCRIPTION: Dependency update report
          TITLE: Dependency update check report
          CLOSE_COMMENT: All checked dependencies are current.
        # A clean run edits/closes an existing report issue but never
        # creates a fresh one — the report markdown is already in the
        # step summary, so nothing is lost.
        run: |
          clean=0
          [ "$OUTDATED" = "0" ] && [ "$UNKNOWN_COUNT" = "0" ] && clean=1
          CLEAN=$clean bash scripts/upsert_report_issue.sh
